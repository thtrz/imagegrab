<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>图片工作台 · 图提取</title><link rel="icon" href="icons/icon48.png"><link rel="stylesheet" href="gallery.css"></head>
<body><header class="topbar"><a class="brand" href="help.html"><span class="brand-icon">▧</span><strong>图提取<span>ImageGrab</span></strong></a><a class="help-link" href="help.html" target="_blank" rel="noopener">使用帮助 ↗</a></header>
<main><section class="heading"><p class="eyebrow">YOUR IMAGES, ORGANIZED.</p><h1>把好图片，一起带走。</h1><p id="source-title">正在读取扫描记录…</p><a id="source-link" target="_blank" rel="noopener noreferrer" hidden>返回商品页面 ↗</a></section>
<section class="toolbar" aria-label="图片选择与下载"><div class="toolbar-main"><div class="selection-buttons"><button id="select-all" type="button">全选可见图片</button><button id="invert" type="button">反选</button><button id="clear" type="button">清空选择</button></div><button id="download" class="primary" type="button" disabled>下载选中图片</button></div><div class="toolbar-meta"><p id="counts" aria-live="polite">0 张图片 · 已选 0 张</p><div class="filters"><label>最短边 <select id="min-size"><option value="100">100 px</option><option value="300">300 px</option><option value="600">600 px</option><option value="1000">1000 px</option></select></label><label>排序 <select id="sort"><option value="original">提取顺序</option><option value="size">大图优先</option></select></label></div></div></section>
<section id="progress-panel" class="progress-panel" hidden aria-label="下载进度"><div class="progress-heading"><strong id="progress-text">准备下载</strong><button id="stop" type="button">停止后续下载</button></div><progress id="progress" value="0" max="1"></progress><p>请保持本页打开。文件保存在默认下载目录下的 ImageGrab 文件夹。</p></section>
<p id="notice" class="notice" role="status">先滚动商品页面加载完整详情图，再提取，效果更好。</p><ul id="image-grid" class="image-grid" aria-label="提取的图片"></ul><section id="empty" class="empty" hidden><div>▧</div><h2>这里还没有图片</h2><p id="empty-message">请回到商品页面，点击右下角的“获取图片”。</p><a href="help.html">查看安装与使用说明 →</a></section><details id="errors" class="errors" hidden><summary id="errors-title">下载失败的图片</summary><ul id="error-list"></ul></details></main>
<footer>在本机提取与转换 · 不需要 AI 接口 · 仅保存你有权使用的图片</footer><script src="lib/core.js"></script><script src="gallery.js"></script></body></html>
